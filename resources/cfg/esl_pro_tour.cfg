// ESL Pro Tour — Counter-Strike Game Specific Rules 2026
// Source: ESL Pro Tour CS Game Specific Rules (updated 20 January 2026), Section 2.4
//
// Deploy this file to your CS2 game server's cfg/ directory.
// eBot will execute it via RCON at match start when EBOT_DEFAULT_RULES=esl_pro_tour.
//
// Settings managed by eBot (do NOT set here — eBot sends these via RCON):
//   mp_maxrounds, mp_overtime_maxrounds, mp_overtime_startmoney
//
// All other match settings belong here.

// Round timing
mp_roundtime            1.92    // 1 min 55 sec (§2.4)
mp_roundtime_defuse     1.92
mp_freezetime           20      // 20 sec freeze time (§2.4)
mp_buytime              20      // 20 sec buy time (§2.4)
mp_c4timer              40      // 40 sec bomb timer (§2.4)
mp_round_restart_delay  5       // 5 sec restart delay (§2.4)

// Economy
mp_startmoney           800     // $800 start money (§2.4)

// Items
mp_items_prohibited     ""      // No prohibited items (§2.4)

// Warmup (keep short — teams have 5 min pre-match check per §2.5)
mp_warmuptime           15
mp_warmup_pausetimer    0

// TV / GOTV recording (POV demos required per §2.10.6)
tv_enable               1
tv_delay                105
tv_advertise_watchable  1

// Misc
sv_cheats               0
sv_lan                  0
