services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ebot-web-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - ebot
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: ebot-web-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ebot
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: ebot-web-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ebotv3
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: ebot
      MYSQL_PASSWORD: ebot
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ebot
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ebot-web-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ebot

  node:
    image: node:22-alpine
    container_name: ebot-web-node
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: npm run dev
    ports:
      - "5173:5173"
    networks:
      - ebot
    profiles:
      - dev

networks:
  ebot:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
